<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakarta Soundscape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Jakarta Soundscape</h1>

  <!-- Audio element linked to a reliable open-source stream -->
  <audio id="rainAudio" controls src="https://actions.google.com/sounds/v1/weather/rain_heavy.ogg" preload="auto"></audio>

  <br><br>
  <button id="playBtn">Toggle Sound & Animation</button>
  
  <!-- Visualscape box that animates on interaction -->
  <div id="box"></div>

  <script src="script.js"></script>
</body>
</html>
