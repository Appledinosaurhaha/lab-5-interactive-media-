<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakarta Soundscape</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Jakarta Soundscape</h1>

  <!-- Audio element using Wikimedia Commons stable direct stream -->
  <audio id="rainAudio" controls preload="auto" src="https://upload.wikimedia.org/wikipedia/commons/b/b3/Thunderstorm_in_the_forest_%28Ndz1%2C_FMA%29.ogg"></audio>

  <br><br>
  <button id="playBtn">Toggle Sound & Animation</button>
  
  <div class="image-container">
    <img id="visualImg" src="https://images.unsplash.com/photo-1519692933481-e162a57d6721" alt="Jakarta Atmosphere">
  </div>

  <script src="script.js"></script>
</body>
</html>
